<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Live status board: whether the computer and phone are online, and what Folia is playing right now."
    />
    <title>Am I Online?</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23150f23'/><rect x='8' y='13' width='16' height='6' rx='2' fill='%23c2ef4e'/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="board" aria-labelledby="board-title">
      <header class="board-head">
        <div class="board-id">
          <h1 id="board-title">Am I Online?</h1>
          <p class="board-sub" id="summary">Connecting to the server</p>
        </div>

        <div class="board-actions">
          <p class="state" id="stateChip" data-state="loading">
            <span class="state-mark" aria-hidden="true"></span>
            <span class="state-text" id="stateText">Connecting</span>
          </p>
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-pressed="false"
            aria-label="Switch to light theme"
          >
            <span class="theme-glyph" data-glyph="moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
              </svg>
            </span>
            <span class="theme-glyph" data-glyph="sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4.2" />
                <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" />
              </svg>
            </span>
          </button>
        </div>
      </header>

      <section class="stage" id="stage" data-count="0" aria-live="polite">
        <div class="status-pane" id="statusPane" data-tone="loading">
          <div class="message">
            <p class="message-title" id="statusTitle">Connecting to the server</p>
            <p class="message-note" id="statusNote">Waiting for the first response.</p>
          </div>
        </div>
      </section>

      <footer class="board-foot">
        <span id="updated">No data yet</span>
        <span class="foot-note" id="footNote"></span>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
